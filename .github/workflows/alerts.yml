# Phone alerts need checking more often than Vercel's free daily cron allows, so GitHub runs the check every
# 30 minutes (about 1,500 runs a month, inside the free Actions minutes even for a private repo).
# Set two repository secrets (Settings → Secrets and variables → Actions): SITE_URL (e.g. https://laylock.app)
# and CRON_SECRET (the same value as on Vercel). Without them the job does nothing.
name: Pick alerts
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check open picks and send alerts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL secret not set; skipping."; exit 0; fi
          # Follow any redirect (http → https, bare domain → www) first, without the secret, so the real call
          # lands on the final address with its Authorization header intact.
          url=$(curl -sSL -o /dev/null -m 30 -w '%{url_effective}' "${SITE_URL%/}/api/cron/alerts")
          echo "Calling $url"
          body=$(curl -fsS -m 290 -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "$body" | head -c 2000; echo
          # A page instead of the JSON answer means the check never ran: fail so it shows up red.
          case "$body" in "{"*) ;; *) echo "::error::Expected JSON from /api/cron/alerts; check the SITE_URL secret."; exit 1;; esac
