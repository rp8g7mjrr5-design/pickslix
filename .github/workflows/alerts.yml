# Phone alerts need checking more often than Vercel's free daily cron allows, so GitHub runs the check.
# Set two repository secrets (Settings → Secrets and variables → Actions): SITE_URL (e.g. https://laylock.app)
# and CRON_SECRET (the same value as on Vercel). Without them the job does nothing.
name: Pick alerts
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check open picks and send alerts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL secret not set; skipping."; exit 0; fi
          curl -fsS -m 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/alerts"
