<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<title>Offline · LayLock</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090d; color: #eef3f8; font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #8a96a6; margin: 0 0 20px; max-width: 320px; }
  button { background: #2bf59b; color: #07090d; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 800; font-size: 15px; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>LayLock needs a connection for fresh odds. Your saved slips are safe on this phone and will be there when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
